  fallback_model: llama-3.3-70b-versatile

summarization:
  model: llama-3.3-70b-versatile
seo:
  model: llama-3.3-70b-versatile

web:
  site_name: "Forty Hadith | A Waqf Project"
  site_description: "Lessons from Sheikh Ibn Uthaymeen's explanation of Imam An-Nawawi's Forty Hadith"
  default_locale: ar
  supported_locales: [ar, en, es, fr, id, ur]

sleep: 3.0
